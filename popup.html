<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 240px;
      margin: 0;
      padding: 14px;
      font: 13px/1.4 system-ui, sans-serif;
      background: #1d2621;
      color: #eef6ef;
    }
    header { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
    header img { width: 20px; height: 20px; }
    #host { margin: 12px 0 4px; word-break: break-all; color: #b9c9bd; }
    #status { margin-bottom: 12px; }
    button {
      width: 100%;
      padding: 7px 10px;
      font: inherit;
      font-weight: 600;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      background: #ffc542;
      color: #302505;
    }
    button.enable { background: #eef6ef; color: #1d2621; }
    button[hidden] { display: none; }
  </style>
</head>
<body>
  <header><img src="icons/icon32.png" alt="">Vimish</header>
  <div id="host"></div>
  <div id="status"></div>
  <button id="toggle" hidden></button>
  <script src="popup.js"></script>
</body>
</html>
